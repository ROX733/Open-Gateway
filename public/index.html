<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Gateway Login</title>
<style>
body{background:#f5f5f7;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}
.card{background:white;padding:30px;border-radius:20px;width:90%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;margin:8px 0;background:#2a5bff;color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
button:nth-child(2){background:#e8eaff;color:#2a5bff}
#msg{margin-top:10px;color:red;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>MyGateway Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
<div id="msg"></div>
</div>

<script>
const API = ''; // same domain https://open-gateway.onrender.com
async function register(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  document.getElementById('msg').innerText='Registering...';
  try{
    const res=await fetch(API+'/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(res.ok){ document.getElementById('msg').style.color='green'; document.getElementById('msg').innerText='Registered! Now click Login'; }
    else{ document.getElementById('msg').style.color='red'; document.getElementById('msg').innerText=data.error||data.msg||'Failed'; }
  }catch(e){ document.getElementById('msg').innerText='Server error - Check 【entity-MongoDB¦canonical_name=MongoDB】 URI'; }
}
async function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  document.getElementById('msg').innerText='Logging in...';
  try{
    const res=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(res.ok && data.token){ localStorage.setItem('token',data.token); localStorage.setItem('email',email); document.getElementById('msg').style.color='green'; document.getElementById('msg').innerText='Login success! Redirecting...'; setTimeout(()=>{ window.location.href='/dashboard.html'; },1000); }
    else{ document.getElementById('msg').innerText=data.error||'Invalid login'; }
  }catch(e){ document.getElementById('msg').innerText='Server error'; }
}
</script>
</body>
</html>
